<mat-toolbar>
  <span>Comments ({{ totalCount() }})</span>
</mat-toolbar>

<main class="mx-auto max-w-4xl space-y-4 p-4">
  @if (error()) {
    <p class="text-red-600">{{ error() }}</p>
  }

  @for (comment of comments(); track comment.id) {
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>{{ comment.userName }}</mat-card-title>
        <mat-card-subtitle>{{ comment.createdAt | date: 'dd.MM.yyyy HH:mm' }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content class="pt-3">
        <div [innerHTML]="comment.text"></div>
        @if (comment.replies.length > 0) {
          <p class="mt-2 text-sm text-gray-500">Replies: {{ comment.replies.length }}</p>
        }
      </mat-card-content>
    </mat-card>
  }
</main>
