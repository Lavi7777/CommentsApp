<div class="flex flex-wrap items-center gap-2 rounded bg-slate-200 px-3 py-2">
  <span class="text-sm font-medium text-gray-700">Sort by:</span>
  @for (option of options(); track option.key) {
    <button
      mat-button
      type="button"
      [class.font-bold]="option.key === sortBy()"
      (click)="select(option.key)"
    >
      {{ option.label }}
      @if (option.key === sortBy()) {
        {{ desc() ? '↓' : '↑' }}
      }
    </button>
  }
</div>
