<article>
  <div class="flex items-center gap-3 rounded bg-slate-100 px-3 py-2">
    <app-user-avatar [name]="comment().userName" />
    <span class="font-semibold">{{ comment().userName }}</span>
    <span class="text-xs text-gray-500">{{ comment().createdAt | commentDate }}</span>
  </div>

  @if (parentText()) {
    <div
      class="mx-3 mt-3 truncate border-l-4 border-slate-300 pl-3 text-sm text-gray-600"
      [innerHTML]="parentText()"
    ></div>
  }

  <div class="break-words px-3 py-3 whitespace-pre-line" [innerHTML]="comment().text"></div>

  <div class="px-1">
    <button mat-button type="button" (click)="toggleReply()">
      {{ replying() ? 'Cancel' : 'Reply' }}
    </button>
  </div>

  @if (replying()) {
    <div class="mt-2">
      <app-comment-form [parentId]="comment().id" (created)="onReplyCreated()" />
    </div>
  }

  @if (comment().replies.length > 0) {
    <div class="mt-3 ml-4 space-y-3 sm:ml-8">
      @for (reply of comment().replies; track reply.id) {
        <app-comment-item
          [comment]="reply"
          [parentText]="comment().text"
          (created)="created.emit()"
        />
      }
    </div>
  }
</article>
